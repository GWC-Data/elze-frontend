map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen ${PORT};
    listen [::]:${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=60s ipv6=off;
    resolver_timeout 5s;

    set $backend_url ${BACKEND_URL};
    set $adk_api_url ${ADK_API_URL};

    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    # Shared by every proxied location.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # ------------------------------------------------------------ SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the current asset hashes; never let it go stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass $backend_url;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /_gate/agents {
        internal;
        proxy_pass $backend_url/api/gate/agents;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /svc/adk/ {
        auth_request /_gate/agents;

        auth_request_set $gate_reason $upstream_http_x_gate_reason;
        add_header X-Gate-Reason $gate_reason always;

        rewrite ^/svc/adk(/.*)$ $1 break;
        proxy_pass $adk_api_url;

        proxy_set_header X-API-Key "${ADK_API_KEY}";
        proxy_set_header Cookie "";

        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
