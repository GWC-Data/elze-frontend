# The `web` container: the built SPA, and the ONLY entry point to the stack.
#
# The browser sees one origin. Every backend is reached through a path prefix
# here, so there is no CORS to configure and no internal port is ever published:
#
#   /           -> the SPA (index.html fallback for client-side routes)
#   /api/       -> backend     :8080  Express. Prefix KEPT - Express mounts at /api.
#   /svc/adk/   -> adk-api     :8300  ADK Agent Runtime API. Prefix STRIPPED.
#   /health     -> 200 from nginx itself (liveness of THIS container only)
#
# The agent service has no sign-in of its own, so every request to it first
# passes the backend's gate: `auth_request /_gate/agents` asks GET /api/gate/agents whether
# THIS session may make THIS call (feature enabled for the company + permission in the role;
# backend/src/services/agentGate.service.ts). 2xx = proxied, 401/403 = refused with that
# status. The session cookie (Path=/) is then stripped, so no token reaches either service.
#
# Upstreams are compose service names. Docker's embedded DNS resolves them
# locally; on Cloud Run, `gcloud run compose` writes the same names into
# /etc/hosts of every container. proxy_pass therefore uses literal hostnames,
# resolved once at startup through the system resolver (which reads
# /etc/hosts), and deliberately NOT a `resolver` + variable: nginx's resolver
# speaks DNS only and never reads /etc/hosts, so the names would not resolve on
# Cloud Run. Consequence: nginx refuses to start if a name is unknown - which is
# why web depends_on every upstream.
#
# Upstream ADDRESSES are template variables (BACKEND_UPSTREAM, ADK_UPSTREAM),
# because the right one depends on how the stack is deployed:
#   - Docker Compose and `gcloud run compose`: the service names above
#     (the Dockerfile's defaults).
#   - Cloud Run deployed any other way (cloudbuild.yaml): 127.0.0.1:<port>.
#     Only a Compose deploy writes service names into /etc/hosts; in a plain
#     multi-container service every container shares ONE network namespace,
#     so a sidecar is reached on the loopback address - which is why each
#     service has a distinct port.
#
# This file is a template: the official nginx image runs envsubst over
# /etc/nginx/templates/*.template at startup, substituting only variables that
# are defined in the environment (all three defaulted by the Dockerfile).
# nginx's own $variables are left alone.

# Cloud Run terminates TLS in front of this container, so $scheme is always
# "http" here. Pass on the scheme the browser actually used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default is 1 MB, which rejects ADK artifact uploads with a 413
    # before the service ever sees them. 32 MB is
    # Cloud Run's own HTTP/1 request-size ceiling, so nothing larger could get
    # through anyway.
    client_max_body_size 32m;

    # Shared by every proxied location.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # ------------------------------------------------------------ SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the current asset hashes; never let it go stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------ Node backend
    # No URI on proxy_pass: the request path, /api prefix included, is passed
    # through unchanged. (A trailing "/" here would strip /api, and Express
    # would answer every call with the SPA's index.html.)
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ------------------------------------------------------------ agent gate
    # Internal only: the auth_request target of the agent location below. The
    # subrequest carries the browser's headers (so its cookies) but never its body.
    location = /_gate/agents {
        internal;
        proxy_pass http://${BACKEND_UPSTREAM}/api/gate/agents;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ------------------------------------------------------------ ADK API
    # Chat streams Server-Sent Events, and `stream: false` extraction runs hold
    # one request open for the whole agent run - hence no buffering and long
    # timeouts.
    location /svc/adk/ {
        auth_request /_gate/agents;
        # FEATURE_NOT_ENABLED vs. INSUFFICIENT_PERMISSION, so the app can say which.
        auth_request_set $gate_reason $upstream_http_x_gate_reason;
        add_header X-Gate-Reason $gate_reason always;
        proxy_pass http://${ADK_UPSTREAM}/;

        # The ADK API's shared key is injected HERE, server-side, so it never
        # has to be baked into the JavaScript bundle (a VITE_* value is readable
        # by anyone who loads the page). Empty = no header is sent, which is
        # what the ADK API expects when ADK_API_AUTH_TOKEN is unset. This also
        # replaces any X-API-Key the client sent.
        proxy_set_header X-API-Key "${ADK_API_KEY}";
        # The gate has read the session; the ADK API has no use for it.
        proxy_set_header Cookie "";
        # Any proxy_set_header in a location discards ALL inherited ones, so the
        # server-level set is repeated here, not inherited.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------------ health
    # Proves nginx is up and serving - nothing about the upstreams. The real
    # dependency checks already exist and are reachable through the routes
    # above: GET /api/health (backend; 503 until its database bootstrap has
    # succeeded) and GET /svc/adk/health (ADK API; lists the agents that
    # loaded).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
